version: "3.9"

services:
  db:
    image: postgres:15
    container_name: books_db
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: books_redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: books_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/library
      REDIS_URL: redis://redis:6379/0

  prism:
    image: stoplight/prism:4
    container_name: books_prism_mock
    command: mock -h 0.0.0.0 -p 4010 /tmp/openapi.yaml
    ports:
      - "4010:4010"
    volumes:
      - ./openapi.yaml:/tmp/openapi.yaml:ro

volumes:
  postgres_data: